<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Acceso al CMS | Summit Expansión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #fcea10;
      --primary-hover: #e5d40d;
      --primary-text: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(ellipse at 50% 20%, #1e293b 0%, #090d16 70%, #030712 100%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(252, 234, 16, 0.08) 0%, transparent 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(252, 234, 16, 0.12);
      border: 1px solid rgba(252, 234, 16, 0.3);
      border-radius: 99px;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.85rem;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #fff;
      font-size: 0.925rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(252, 234, 16, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      line-height: 1;
    }

    .toggle-password:hover {
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-top: 1.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px rgba(252, 234, 16, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-box {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* Preset credentials box for testing */
    .quick-roles-box {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
    }

    .quick-roles-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 700;
      text-align: center;
    }

    .quick-roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quick-role-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .quick-role-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .quick-role-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .quick-role-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-admin {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .badge-editor {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .quick-role-user {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .login-footer-links {
      text-align: center;
      margin-top: 1.5rem;
    }

    .login-footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.825rem;
      transition: color 0.2s;
    }

    .login-footer-links a:hover {
      color: var(--primary);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(15, 23, 42, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary-text);
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-badge">⚡ Summit CMS Engine</div>
      <h1 class="brand-title">Expansión Summit</h1>
      <p class="brand-subtitle">Panel de Control &amp; Gestión Editorial</p>
    </div>

    <div class="login-card">
      <div id="login-alert" class="alert-box alert-error" role="alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="form-input" placeholder="Tu usuario" required autocomplete="username" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña" id="toggle-pw-btn">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span>Ingresar al CMS</span>
          <span>→</span>
        </button>
      </form>

    </div>

  </div>

  <script>
    function togglePasswordVisibility() {
      const pwInput = document.getElementById('password');
      const btn = document.getElementById('toggle-pw-btn');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        btn.textContent = '🙈';
      } else {
        pwInput.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // Solo se permite regresar a rutas internas del CMS
    function safeNext() {
      const next = new URLSearchParams(window.location.search).get('next') || '/admin';
      return (next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/\\')) ? next : '/admin';
    }

    // Limpia restos de la versión anterior que guardaba el token en el navegador
    try { localStorage.removeItem('summit_auth_token'); localStorage.removeItem('summit_auth_user'); } catch (e) {}

    async function handleLogin(e) {
      e.preventDefault();
      const userEl = document.getElementById('username');
      const passEl = document.getElementById('password');
      const alertEl = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-btn');

      const username = userEl.value.trim();
      const password = passEl.value;

      alertEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> <span>Verificando...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          submitBtn.innerHTML = '<span>✓ Acceso Concedido</span>';
          submitBtn.style.background = '#10b981';
          submitBtn.style.color = '#ffffff';

          setTimeout(() => {
            window.location.href = safeNext();
          }, 350);
        } else {
          alertEl.textContent = data.error || 'Credenciales inválidas. Por favor intenta de nuevo.';
          alertEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Ingresar al CMS</span> <span>→</span>';
          passEl.value = '';
          passEl.focus();
        }
      } catch (err) {
        alertEl.textContent = 'Error de conexión con el servidor. Verifica que el servicio esté activo.';
        alertEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Ingresar al CMS</span> <span>→</span>';
      }
    }

    // Auto-check if already logged in
    (async function checkExistingAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) {
            window.location.href = safeNext();
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
